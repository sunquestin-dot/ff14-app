# 1時間ごとに Claude 関連の新着を集めて claude/feeds.json を更新する
# リポジトリの Secrets に ANTHROPIC_API_KEY を入れると、日本語の要約と週のまとめも作る
name: Claudeの新着を集める

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node fetch-claude.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 変わっていれば保存する
        run: |
          # 更新時刻だけが変わった場合は保存しない
          if git diff --quiet -I '"updatedAt"' -- feeds.json && git ls-files --error-unmatch feeds.json >/dev/null 2>&1; then
            echo "新着なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git commit -m "Claudeの新着を更新"
          # FF14 側の自動更新と重なった時のために、取り込んでから送る
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
